spring.application.name=devshelf-api

# --- HTTP ---------------------------------------------------------------
# Render (and most PaaS hosts) inject PORT.
server.port=${PORT:8080}
server.shutdown=graceful
server.error.include-stacktrace=never
server.error.include-message=never

# --- Database -----------------------------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:devshelf}
spring.datasource.username=${DB_USERNAME:devshelf}
spring.datasource.password=${DB_PASSWORD:devshelf}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
# NULLs sort last in both directions (only published_at is nullable among the sort keys).
# Spring Data drops Sort.Order.nullsLast() on @Query methods, so this is set here instead.
spring.jpa.properties.hibernate.order_by.default_null_ordering=last

spring.flyway.enabled=true

# --- JSON ---------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=always
spring.jackson.time-zone=UTC

# --- Application --------------------------------------------------------
# Comma-separated list of browser origins allowed to call /api/**.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
# Zone that defines "today" when validating published dates.
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
# Own public health URL to GET every app.keep-awake-interval (ISO-8601 duration) so a free Render instance stays up.
# Empty = disabled (local runs, tests).
app.keep-awake-url=${APP_KEEP_AWAKE_URL:}
app.keep-awake-interval=${APP_KEEP_AWAKE_INTERVAL:PT10M}

# --- Operations ---------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Swagger UI is deliberately public: this is a demo API with no secrets behind it.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.paths-to-match=/api/**
