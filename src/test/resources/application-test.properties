# Tests run against in-memory H2 in PostgreSQL mode; Flyway applies the same migrations.
# H2 keeps its default NULL ordering on purpose: Hibernate decides whether to emit "nulls last" from
# what the dialect says the database does by default, so changing it here would make Hibernate wrong.
spring.datasource.url=jdbc:h2:mem:devshelf;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
