# Render Blueprint: one free Docker web service and one free PostgreSQL database.
services:
  - type: web
    name: devshelf-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_HOST
        fromDatabase:
          name: devshelf-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: devshelf-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: devshelf-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: devshelf-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: devshelf-db
          property: password
      # The deployed frontend origin(s), comma-separated, e.g. https://devshelf.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: devshelf-db
    databaseName: devshelf
    user: devshelf
    plan: free
    region: singapore
