# Render Blueprint: one free Docker web service and one free PostgreSQL database.
# Render passes a Postgres connection only as one connection string, so the service gets DATABASE_URL and the
# app turns it into its JDBC settings (config/DatabaseUrlEnvironmentPostProcessor).
services:
  - type: web
    name: devshelf-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: devshelf-db
          property: connectionString
      # The deployed frontend origin(s), comma-separated, e.g. https://devshelf.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        sync: false

databases:
  - name: devshelf-db
    databaseName: devshelf
    user: devshelf
    plan: free
    region: singapore
